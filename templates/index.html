<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix WELCOME Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <!-- Netflix Opening "N" Zoom Animation Screen -->
  <div class="intro-screen">
    <div class="netflix-n"></div>
  </div>

  <nav>
    <a href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo" />
    </a>
  </nav>

  <div class="background-image"></div>

  <div class="form-wrapper">
    <h1>hi this is Purna</h1>
    <h2>NETFLIX SIGN IN V-2.7</h2>
    <form action="/" method="POST">
      <div class="form-control">
        <input type="text" name="mobile" id="mobile" required placeholder=" " />
        <label for="mobile">Mobile number or email</label>
      </div>
      <div class="form-control">
        <input type="password" name="password" id="password" required placeholder=" " />
        <label for="password">Password</label>
      </div>
      <button type="submit">WELCOME TO NETFLIX V-5.0</button>
      
      <div class="form-help">
        <div class="remember-me">
          <input type="checkbox" name="remember" id="remember-me" checked />
          <label for="remember-me">Remember me</label>
        </div>
        <a href="#">Need help?</a>
      </div>
    </form>

    <p>New to Netflix? <a href="#">Lets join up now</a></p>
    <small>
      This page is protected by Google reCAPTCHA to ensure you're not a bot.
      <a href="#">Learn more.</a>
    </small>
  </div>
</body>
</html>
